name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; never cancel runs on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each language step runs only once that service has its project file,
# so the workflow passes on the empty skeleton and tightens as code lands.
# The jobs only install toolchains; `make lint` / `make test` are the entry
# points, the same commands developers run locally (Reuse Registry).
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lint workflows (actionlint)
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

      - name: Set up Go
        if: hashFiles('gateway/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod # the single Go version (ADR-116)
          cache-dependency-path: gateway/go.sum
      - name: Install golangci-lint
        if: hashFiles('gateway/go.mod') != ''
        # Version comes from the Makefile (ADR-116); same install as local.
        run: |
          make install-lint
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up uv
        if: hashFiles('control-plane/pyproject.toml', 'harness/pyproject.toml') != ''
        uses: astral-sh/setup-uv@v6

      - name: Set up pnpm
        if: hashFiles('console/package.json') != ''
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node
        if: hashFiles('console/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Lint (make lint)
        run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        if: hashFiles('gateway/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod # the single Go version (ADR-116)
          cache-dependency-path: gateway/go.sum

      - name: Set up uv
        if: hashFiles('control-plane/pyproject.toml', 'harness/pyproject.toml') != ''
        uses: astral-sh/setup-uv@v6

      - name: Set up pnpm
        if: hashFiles('console/package.json') != ''
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node
        if: hashFiles('console/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Test (make test)
        run: make test

      - name: Summary
        if: always()
        run: |
          {
            echo "### Test job"
            for f in gateway/go.mod control-plane/pyproject.toml harness/pyproject.toml console/package.json; do
              if [ -f "$f" ]; then echo "- $f: tested"; else echo "- $f: not scaffolded yet (skipped)"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
